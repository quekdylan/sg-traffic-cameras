<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singapore Traffic Cameras Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root { --panel: #ffffff; --fg: #1a2127; --muted: #5d6973; --line: #d6dce1; }
@media (prefers-color-scheme: dark) { :root { --panel: #182026; --fg: #e4e9ed; --muted: #94a1ac; --line: #2a343c; } }
html, body { height: 100%; margin: 0; background: var(--panel); color: var(--fg);
             font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#map { position: absolute; inset: 0; }
.leaflet-control-layers, .info { background: var(--panel); color: var(--fg); border: 1px solid var(--line);
                                 border-radius: 6px; box-shadow: none; }
.info { padding: 8px 10px; max-width: 240px; line-height: 1.4; }
.info b { display: block; font-size: 15px; }
.info span { color: var(--muted); font-size: 12.5px; }
.leaflet-control-layers-overlays label { display: flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px #0004; }
.leaflet-popup-content { font-size: 13.5px; line-height: 1.4; }
.leaflet-popup-content b { font-size: 14.5px; }
</style>
</head>
<body>
<div id="map" aria-label="Map of Singapore traffic enforcement cameras"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const TYPES = {
  1: ['Red light', '#ff3b30'],
  2: ['Fixed speed', '#ff9f0a'],
  3: ['Mobile speed', '#e0b800'],
  4: ['Average speed', '#c46a00'],
  5: ['Police speed laser (random)', '#2fa8d8'],
  6: ['Traffic violation (TVEC)', '#bf5af2'],
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const map = L.map('map', { preferCanvas: true }).setView([1.3521, 103.8198], 12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Cameras: Singapore Police Force',
}).addTo(map);

const info = L.control({ position: 'topleft' });
info.onAdd = () => {
  const d = L.DomUtil.create('div', 'info');
  d.innerHTML = '<b>Singapore traffic cameras</b><span id="count">Loading…</span><br>' +
    '<span>Lines show the approach each camera covers. <a href="https://github.com/quekdylan/sg-traffic-cameras">Data on GitHub</a></span>';
  return d;
};
info.addTo(map);

fetch('../data/cameras.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(cams => {
    const groups = {};
    for (const t in TYPES) groups[t] = L.layerGroup().addTo(map);
    for (const c of cams) {
      const [name, color] = TYPES[c.type] || ['Camera', '#888888'];
      const popup = '<b>#' + c.id + ' ' + esc(name) + '</b><br>' + esc(c.location) + '<br>' +
        c.lat.toFixed(6) + ', ' + c.lon.toFixed(6);
      L.polyline(c.path, { color, weight: 3, opacity: 0.6 }).bindPopup(popup).addTo(groups[c.type]);
      L.circleMarker([c.lat, c.lon], { radius: 6, color: '#ffffff', weight: 1.5, fillColor: color, fillOpacity: 1 })
        .bindPopup(popup).bindTooltip('#' + c.id + ' ' + name).addTo(groups[c.type]);
    }
    const overlays = {};
    for (const t in TYPES) {
      const n = cams.filter(c => c.type === +t).length;
      overlays['<span class="sw" style="background:' + TYPES[t][1] + '"></span>' + TYPES[t][0] + ' (' + n + ')'] = groups[t];
    }
    L.control.layers(null, overlays, { collapsed: window.innerWidth < 600 }).addTo(map);
    document.getElementById('count').textContent = cams.length + ' cameras. Tick or untick types on the right.';
  })
  .catch(() => { document.getElementById('count').textContent = 'Could not load the camera data.'; });
</script>
</body>
</html>
