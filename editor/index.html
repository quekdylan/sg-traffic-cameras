<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Path Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #f1f3f5; --panel: #ffffff; --fg: #1a2127; --muted: #5d6973; --line: #dde2e6; --hover: #f5f7f8;
  --accent: #d97800; --accent-fg: #ffffff; --path: #1d5fcc; --cand: #6f7b86; --ok: #23864c; --warn: #b5470b;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #11161a; --panel: #182026; --fg: #e4e9ed; --muted: #97a3ad; --line: #2b353d; --hover: #1e272e;
  --accent: #ffa62b; --accent-fg: #1a1205; --path: #5a9cff; --cand: #9aa6b0; --ok: #4cc07c; --warn: #f08a4b; color-scheme: dark } }

html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: minmax(320px, 400px) 1fr; height: 100%; }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
.mapwrap { position: relative; min-width: 0; }
#map { position: absolute; inset: 0; }

header { padding: 16px 16px 0; }
h1 { margin: 0; font-size: 19px; }
.sub { margin: 4px 0 12px; color: var(--muted); font-size: 13.5px; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab { flex: 1; padding: 9px 4px; background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); font-size: 12px; }

.body { flex: 1; overflow-y: auto; min-height: 0; }
.pad { padding: 14px 16px; display: grid; gap: 12px; }
.pad p { margin: 0; }
.empty { color: var(--muted); }
.search { width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
.hint { color: var(--muted); font-size: 13px; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 10px 16px; background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--hover); }
.row .id { font: 13px var(--mono); color: var(--muted); }
.row .loc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.chip { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.chip.new { color: var(--accent); }
.filter { display: flex; gap: 6px; }
.filter button { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: none; cursor: pointer; font-size: 13px; }
.filter button[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--panel); } .chip.approved, .chip.changed { color: var(--ok); } .chip.published { color: var(--muted); }

.back { background: none; border: 0; padding: 0; color: var(--path); cursor: pointer; justify-self: start; }
.title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.title b { font-size: 19px; }
.type { color: var(--muted); }
.spf { font-size: 15px; }
.why { font-size: 13px; color: var(--warn); }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cands { display: grid; gap: 6px; }
.cand { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: none; cursor: pointer; }
.cand[aria-pressed="true"] { border-color: var(--path); box-shadow: inset 0 0 0 1px var(--path); }
.cand .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cand .meta { font: 12px var(--mono); color: var(--muted); }
.cand svg { color: var(--path); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 650; }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.06); }
.btn.big { width: 100%; padding: 11px; font-size: 15.5px; }
.note { padding: 9px 11px; border-radius: 8px; background: var(--bg); font-size: 13.5px; }
.note.ok { color: var(--ok); }
.links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; }
.links a, .linkbtn { color: var(--path); }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; font-size: 13.5px; text-decoration: underline; }
.coords { font: 12px var(--mono); color: var(--muted); }
:focus-visible { outline: 2px solid var(--path); outline-offset: 1px; }

.changes { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 10px; background: var(--panel); }
.changes span { flex: 1; font-weight: 600; }
.chg { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.chg small { color: var(--muted); display: block; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }

.vx { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--path); box-sizing: border-box; margin: -7px 0 0 -7px; cursor: grab; }
.vx.sel { background: var(--accent); border-color: var(--accent); }
.vx.end { border-color: var(--accent); }
.mid { width: 12px; height: 12px; border-radius: 50%; background: var(--path); opacity: .35; margin: -6px 0 0 -6px; cursor: copy; }
.mid:hover { opacity: .9; }
.cam { width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 5px; border: 3px solid #fff; box-sizing: border-box; box-shadow: 0 0 0 1px #0006; }
.legend { position: absolute; z-index: 500; left: 10px; bottom: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 18px; border-top: 4px solid var(--path); }
.legend i.c { border-top: 2px dashed var(--cand); }
.legend i.s { width: 10px; height: 10px; border: 0; border-radius: 3px; background: var(--accent); }
.leaflet-container { font: inherit; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 48vh 1fr; height: auto; min-height: 100%; }
  .mapwrap { order: -1; height: 48vh; }
  .side { border-right: 0; }
  .changes { position: sticky; bottom: 0; }
  .legend { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <header>
      <h1>Camera path editor</h1>
      <p class="sub">Check new cameras, or suggest a fix to the road a camera covers.</p>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-mode="new">New cameras<span class="count" id="newCount" hidden></span></button>
        <button class="tab" role="tab" data-mode="fix">Fix a camera</button>
      </div>
    </header>
    <div class="body" id="body"><div class="pad empty">Loading cameras…</div></div>
    <footer class="changes" id="changes" hidden></footer>
  </aside>
  <div class="mapwrap">
    <div id="map" aria-label="Map"></div>
    <div class="legend"><span><i></i>Approach path: traffic drives this way</span><span><i class="s"></i>The camera</span><span><i class="c"></i>Another possible road</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const REPO = location.hostname.endsWith('.github.io')
  ? location.hostname.split('.')[0] + '/' + location.pathname.split('/')[1]
  : 'quekdylan/sg-traffic-cameras';
const TYPES = {
  1: ['Red light', '#ff3b30'], 2: ['Fixed speed', '#ff9f0a'], 3: ['Mobile speed', '#e0b800'],
  4: ['Average speed', '#c46a00'], 5: ['Police speed laser', '#2fa8d8'], 6: ['Traffic violation (TVEC)', '#bf5af2'],
};
const KEY = 'sg-traffic-cameras-changes';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- geometry (local metres around Singapore)
const LAT0 = 1.3521, LON0 = 103.8198, MLAT = 110574, MLON = 111320 * Math.cos(LAT0 * Math.PI / 180);
const xy = p => [(p[1] - LON0) * MLON, (p[0] - LAT0) * MLAT];
const toLL = q => [+(q[1] / MLAT + LAT0).toFixed(6), +(q[0] / MLON + LON0).toFixed(6)];
const brg = (a, b) => { const A = xy(a), B = xy(b); return (Math.atan2(B[0] - A[0], B[1] - A[1]) * 180 / Math.PI + 360) % 360; };
const dist = (a, b) => { const A = xy(a), B = xy(b); return Math.hypot(B[0] - A[0], B[1] - A[1]); };
const pathLen = p => p.slice(1).reduce((s, q, i) => s + dist(p[i], q), 0);
const compass = d => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(d / 45) % 8];
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const arrow = deg => '<svg width="20" height="20" viewBox="-10 -10 20 20" aria-hidden="true"><g transform="rotate(' + Math.round(deg) + ')"><path d="M0 -8 L5 4 L0 1 L-5 4 Z" fill="currentColor"/></g></svg>';

// ---------- state
let CAMS = [], BY_ID = new Map();
let mode = 'new', view = 'list', current = null, query = '', country = 'all';
let drawing = null, selVertex = null;
const edits = new Map();   // id -> { cand, path, approved }

const edit = id => edits.get(id) || {};
const isMY = c => +c.id >= 5001;   // Malaysian cameras are numbered from 5001
const inCountry = c => country === 'all' || (country === 'my') === isMY(c);
function countryFilter(list) {
  // Only worth showing when the list has cameras from both countries.
  if (!list.some(isMY) || list.every(isMY)) return '';
  return '<div class="filter" role="group" aria-label="Country">' +
    [['all', 'All'], ['sg', 'Singapore'], ['my', 'Malaysia']].map(([k, t]) =>
      '<button data-country="' + k + '" aria-pressed="' + (country === k) + '">' + t + '</button>').join('') + '</div>';
}
function bindFilter(el) {
  el.querySelectorAll('[data-country]').forEach(b => b.onclick = () => {
    country = b.dataset.country;
    el.querySelectorAll('[data-country]').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });
}
function pathOf(c) {
  const e = edit(c.id);
  if (e.path && e.path.length >= 2) return e.path;
  if (!c.pending) return c.path;
  const i = e.cand ?? c.def;
  return i !== null && i !== undefined && c.cands[i] && c.cands[i].pts.length >= 2 ? c.cands[i].pts : null;
}
const chosen = c => edit(c.id).path ? -1 : (edit(c.id).cand ?? c.def);
// A change is an approved new camera, or a published camera whose path was edited.
const isChange = c => c.pending ? !!edit(c.id).approved && !!pathOf(c) : !!edit(c.id).path && !same(edit(c.id).path, c.path);
const changes = () => CAMS.filter(isChange);
// Same limits the publishing step enforces (tools/update.py), so a submission never gets dropped.
function problem(c) {
  const p = pathOf(c);
  if (!p || p.length < 2) return 'needs at least 2 points';
  if (p.length > 255) return 'has too many points';
  const end = dist(p[p.length - 1], [c.lat, c.lon]), len = pathLen(p);
  if (end > 150) return 'ends ' + Math.round(end) + ' m from the camera. Finish the path at the camera.';
  if (len < 20 || len > 1500) return 'is ' + Math.round(len) + ' m long. Keep it between 20 and 1500 m.';
  return null;
}
function status(c) {
  if (c.pending) return edit(c.id).approved ? ['approved', 'Approved'] : ['new', 'To check'];
  return isChange(c) ? ['changed', 'Changed'] : ['published', 'Published'];
}
function save(id, patch) {
  const next = Object.assign({}, edit(id), patch);
  for (const k of Object.keys(next)) if (next[k] === undefined) delete next[k];
  if (Object.keys(next).length) edits.set(id, next); else edits.delete(id);
  try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(edits))); } catch (e) {}
  render();
}

// ---------- sidebar
const bodyEl = document.getElementById('body');
function render() {
  const pend = CAMS.filter(c => c.pending);
  const todo = pend.filter(c => !edit(c.id).approved).length;
  const nc = document.getElementById('newCount');
  nc.hidden = !todo; nc.textContent = todo;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.mode === mode && view !== 'submit'));
  if (view === 'camera' && current) renderCamera();
  else if (view === 'submit') renderSubmit();
  else if (mode === 'new') renderNewList(pend);
  else renderFixList();
  renderChanges();
  drawCams();
  drawSelected();
}

function row(c) {
  const [cls, txt] = status(c);
  return '<button class="row" data-id="' + c.id + '"><span class="id">#' + c.id + '</span>' +
    '<span class="loc"><span class="dot" style="background:' + TYPES[c.type][1] + '"></span> ' + esc(c.location) + '</span>' +
    '<span class="chip ' + cls + '">' + txt + '</span></button>';
}
function bindRows(el) { el.querySelectorAll('.row').forEach(r => r.onclick = () => select(r.dataset.id)); }

function renderNewList(pend) {
  if (!pend.length) {
    bodyEl.innerHTML = '<div class="pad"><p class="empty">No new cameras are waiting to be checked.</p>' +
      '<p class="hint">To correct an existing camera, use <b>Fix a camera</b>.</p></div>';
    return;
  }
  bodyEl.innerHTML = '<div class="pad"><p class="hint">These cameras were added or moved on the SPF list, or are Malaysian cameras checked by hand. Check that each path follows the road traffic takes to reach the camera, then approve it.</p>' +
    countryFilter(pend) + '</div>' + pend.filter(inCountry).map(row).join('');
  bindRows(bodyEl);
  bindFilter(bodyEl);
}

function renderFixList() {
  if (!bodyEl.querySelector('#q')) {
    bodyEl.innerHTML = '<div class="pad"><input id="q" class="search" type="search" placeholder="Camera number or road name" aria-label="Find a camera">' +
      countryFilter(CAMS) + '<p class="hint">Or tap a camera on the map.</p></div><div id="results"></div>';
    bindFilter(bodyEl);
    const q = bodyEl.querySelector('#q');
    q.value = query;
    q.oninput = () => { query = q.value; renderResults(); };
  }
  renderResults();
}
function renderResults() {
  const el = document.getElementById('results'); if (!el) return;
  const q = query.trim().toLowerCase().replace(/^#/, '');
  const hits = (!q ? CAMS.filter(isChange) : CAMS.filter(c => c.id === q || c.location.toLowerCase().includes(q))).filter(inCountry);
  el.innerHTML = hits.slice(0, 60).map(row).join('') +
    (q && !hits.length ? '<div class="pad empty">No camera matches.</div>' : '') +
    (hits.length > 60 ? '<div class="pad hint">Showing 60 of ' + hits.length + '. Type more to narrow it down.</div>' : '');
  bindRows(el);
}

function renderCamera() {
  const c = current, e = edit(c.id), path = pathOf(c), idx = chosen(c);
  const [cls, txt] = status(c);
  let h = '<div class="pad">' +
    '<button class="back" id="back">← ' + (mode === 'new' ? 'New cameras' : 'Back to search') + '</button>' +
    '<div class="title"><b>#' + c.id + '</b><span class="type">' + esc(TYPES[c.type][0]) + '</span><span class="chip ' + cls + '">' + txt + '</span></div>' +
    '<div class="spf">' + esc(c.location) + '</div>';
  if (c.why) h += '<div class="why">' + (c.why === 'new' ? 'New on the SPF list'
    : c.why === 'new-my' ? 'New Malaysian camera, position checked by hand' + (c.source ? ' (' + esc(c.source) + ')' : '')
    : 'Moved on the SPF list (' + esc(c.why.replace('moved from', 'was at')) + ')') + '</div>';

  if (drawing) {
    h += '<div class="note">Tap the map along the road, <b>in the direction traffic drives</b>. Start about ' + (isMY(c) && /expressway/i.test(c.location) ? '800' : '300 to 400') + ' m before the camera and finish at the camera. You can zoom and pan while drawing.</div>' +
      '<div class="hint">' + drawing.length + ' point' + (drawing.length === 1 ? '' : 's') + ' so far</div>' +
      '<div class="tools"><button class="btn primary" id="drawDone"' + (drawing.length < 2 ? ' disabled' : '') + '>Use this path</button>' +
      '<button class="btn" id="drawUndo"' + (drawing.length ? '' : ' disabled') + '>Undo point</button>' +
      '<button class="btn" id="drawCancel">Cancel</button></div></div>';
    bodyEl.innerHTML = h;
    on('back', () => { drawing = null; back(); });
    on('drawDone', () => { const p = drawing; drawing = null; selVertex = null; save(c.id, { path: p, approved: undefined }); fit(); });
    on('drawUndo', () => { drawing.pop(); render(); });
    on('drawCancel', () => { drawing = null; render(); });
    return;
  }

  if (c.pending && c.cands.filter(k => k.pts.length >= 2).length > 1) {
    h += '<div class="label">Which road and direction?</div><div class="cands">';
    let extra = false;
    c.cands.forEach((k, i) => {
      if (k.pts.length < 2) return;
      if (k.extra && !extra) { extra = true; h += '<div class="hint">Further from the camera</div>'; }
      h += '<button class="cand" data-i="' + i + '" aria-pressed="' + (idx === i) + '">' + arrow(k.bearing) +
        '<span class="nm">' + esc(k.road) + '</span><span class="meta">' + compass(k.bearing) + ' · ' + Math.round(k.dist) + ' m away</span></button>';
    });
    h += '</div>';
  }
  h += '<div class="label">Path</div>' +
    '<div class="hint">' + (path ? 'Traffic drives along the blue line to the camera (orange square), about ' + Math.round(pathLen(path)) +
      ' m. Drag the points to move them, tap a faint dot to add one, or tap a point to select it.' : 'No path yet. Pick a road above or draw one.') + '</div>' +
    '<div class="tools">' +
    '<button class="btn" id="draw">Redraw</button>' +
    '<button class="btn" id="extend"' + (path ? '' : ' disabled') + '>Lengthen 50 m</button>' +
    '<button class="btn" id="delpt"' + (selVertex === null || !path || path.length <= 2 ? ' disabled' : '') + '>Delete point</button>' +
    '<button class="btn" id="reset"' + (e.path || e.cand !== undefined ? '' : ' disabled') + '>Undo changes</button>' +
    '</div>';
  if (c.pending) {
    h += e.approved
      ? '<div class="note ok">Approved. It\'s in your changes below.</div><div class="tools"><button class="btn" id="unapprove">Undo approval</button>' +
        '<button class="btn primary" id="nextNew">Next camera</button></div>'
      : '<button class="btn primary big" id="approve"' + (path ? '' : ' disabled') + '>Path looks right: approve</button>';
  } else if (isChange(c)) {
    h += '<div class="note ok">Changed. It\'s in your changes below. Use Undo changes to drop it.</div>';
  } else {
    h += '<div class="hint">Edit the path on the map. Your fix is added to your changes automatically.</div>';
  }
  const end = path ? path[path.length - 1] : [c.lat, c.lon];
  const head = path ? Math.round(brg(path[path.length - 2], path[path.length - 1])) : 0;
  h += '<div class="label">Check it</div><div class="links">' +
    '<a target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + end[0] + ',' + end[1] + '&heading=' + head + '">Street View facing the camera</a>' +
    '<a target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=map&center=' + c.lat + ',' + c.lon + '&zoom=19&basemap=satellite">Satellite</a>' +
    '<button class="linkbtn" id="copy">Copy coordinates</button></div>' +
    '<div class="coords">' + c.lat.toFixed(6) + ', ' + c.lon.toFixed(6) + '</div></div>';
  bodyEl.innerHTML = h;

  bodyEl.querySelectorAll('.cand').forEach(b => b.onclick = () => {
    selVertex = null; save(c.id, { cand: +b.dataset.i, path: undefined, approved: undefined }); fit();
  });
  on('back', back);
  on('draw', () => { drawing = []; selVertex = null; render(); });
  on('extend', () => {
    const p = pathOf(c).slice(), a = xy(p[0]), b = xy(p[1]), L = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1;
    p.unshift(toLL([a[0] + (a[0] - b[0]) / L * 50, a[1] + (a[1] - b[1]) / L * 50]));
    save(c.id, { path: p, approved: undefined });
  });
  on('delpt', deleteVertex);
  on('reset', () => { selVertex = null; save(c.id, { cand: undefined, path: undefined, approved: undefined }); fit(); });
  on('approve', () => save(c.id, { approved: true }));
  on('unapprove', () => save(c.id, { approved: undefined }));
  on('nextNew', () => {
    const nxt = CAMS.find(k => k.pending && !edit(k.id).approved);
    if (nxt) select(nxt.id); else back();
  });
  on('copy', () => {
    const t = c.lat.toFixed(6) + ', ' + c.lon.toFixed(6);
    try { navigator.clipboard.writeText(t).then(() => { document.getElementById('copy').textContent = 'Copied'; }); } catch (err) {}
  });
}
function on(id, fn) { const el = document.getElementById(id); if (el) el.onclick = fn; }

function renderChanges() {
  const el = document.getElementById('changes'), n = changes().length;
  el.hidden = !n || view === 'submit';
  if (el.hidden) return;
  el.innerHTML = '<span>' + n + ' change' + (n === 1 ? '' : 's') + ' ready</span><button class="btn primary" id="review">Review and submit</button>';
  on('review', () => { view = 'submit'; drawing = null; render(); });
}

function renderSubmit() {
  const list = changes();
  let h = '<div class="pad"><button class="back" id="back">← Back</button><div class="title"><b>Your changes</b></div>';
  if (!list.length) {
    h += '<p class="empty">No changes yet.</p></div>';
  } else {
    h += '<div>' + list.map(c => '<div class="chg"><div>#' + c.id + ' ' + esc(TYPES[c.type][0]) + '<small>' + esc(c.location) + '</small><small>' +
      (c.pending ? 'New camera, approved' : 'Path changed') + '</small>' +
      (problem(c) ? '<small class="why">Path ' + esc(problem(c)) + '</small>' : '') +
      '</div><button class="btn" data-drop="' + c.id + '">Remove</button></div>').join('') + '</div>' +
      '<ol class="steps"><li>Press <b>Submit on GitHub</b>. GitHub opens with your changes filled in (sign in if asked).</li>' +
      '<li>If it\'s your repo, press <b>Commit changes</b>. The data updates within a couple of minutes.</li>' +
      '<li>Everyone else: press <b>Propose changes</b>, then <b>Create pull request</b>. It goes live once the owner accepts it.</li></ol>' +
      (list.some(problem) ? '<div class="note">Fix the paths marked above before submitting.</div>' : '') +
      '<button class="btn primary big" id="submit"' + (list.some(problem) ? ' disabled' : '') + '>Submit on GitHub</button>' +
      '<div class="hint" id="submitted"></div></div>';
  }
  bodyEl.innerHTML = h;
  on('back', () => { view = current ? 'camera' : 'list'; render(); });
  bodyEl.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
    const c = BY_ID.get(b.dataset.drop);
    save(c.id, c.pending ? { approved: undefined } : { path: undefined, cand: undefined });
  });
  on('submit', () => {
    const out = {};
    for (const c of list) out[c.id] = { path: pathOf(c) };
    const name = new Date().toISOString().replace(/[:.]/g, '-') + '.json';
    window.open('https://github.com/' + REPO + '/new/main/review/submitted?filename=' + encodeURIComponent(name) +
      '&value=' + encodeURIComponent(JSON.stringify(out)), '_blank', 'noopener');
    document.getElementById('submitted').textContent =
      'GitHub opened in a new tab. Your changes stay listed here until they\'re live, then clear themselves.';
  });
}

function select(id) {
  current = BY_ID.get(String(id)); if (!current) return;
  mode = current.pending ? 'new' : 'fix';
  view = 'camera'; drawing = null; selVertex = null;
  render(); fit();
  bodyEl.scrollTop = 0;
}
function back() { view = 'list'; current = null; selVertex = null; render(); }
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  mode = t.dataset.mode; view = 'list'; current = null; drawing = null; selVertex = null; render();
});

// ---------- map
const map = L.map('map', { zoomControl: true, maxZoom: 21, minZoom: 6 }).setView([LAT0, LON0], 12);
map.attributionControl.setPrefix(false);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 21,
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
const camLayer = L.layerGroup().addTo(map);
const selLayer = L.layerGroup().addTo(map);
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const divIcon = html => L.divIcon({ className: '', html, iconSize: [0, 0] });

function chevrons(pts, every, size) {
  // Small V marks along a polyline pointing in its direction.
  const out = []; let acc = every / 2;
  for (let i = 1; i < pts.length; i++) {
    const a = xy(pts[i - 1]), b = xy(pts[i]); const L = Math.hypot(b[0] - a[0], b[1] - a[1]); if (!L) continue;
    const ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
    while (acc < L) {
      const cx = a[0] + ux * acc, cy = a[1] + uy * acc;
      out.push([toLL([cx - ux * size * .4 - uy * size * .5, cy - uy * size * .4 + ux * size * .5]),
                toLL([cx + ux * size * .6, cy + uy * size * .6]),
                toLL([cx - ux * size * .4 + uy * size * .5, cy - uy * size * .4 - ux * size * .5])]);
      acc += every;
    }
    acc -= L;
  }
  return out;
}

function drawCams() {
  camLayer.clearLayers();
  for (const c of CAMS) {
    if (current && view === 'camera' && c.id === current.id) continue;
    const m = L.circleMarker([c.lat, c.lon], { radius: c.pending ? 7 : 5, color: c.pending ? tok('--accent') : '#ffffff',
      weight: c.pending ? 3 : 1.5, fillColor: TYPES[c.type][1], fillOpacity: 1 });
    m.bindTooltip('#' + c.id + ' ' + c.location);
    m.on('click', () => { if (!drawing) select(c.id); });
    camLayer.addLayer(m);
  }
}

function drawSelected() {
  selLayer.clearLayers();
  map.getContainer().style.cursor = drawing ? 'crosshair' : '';
  const c = current; if (!c || view !== 'camera') return;
  const pathCol = tok('--path');
  const camMarker = () => selLayer.addLayer(L.marker([c.lat, c.lon], { interactive: false, zIndexOffset: 1000,
    icon: divIcon('<div class="cam" style="background:' + tok('--accent') + '"></div>') }));
  if (drawing) {
    if (drawing.length > 1) {
      selLayer.addLayer(L.polyline(drawing, { color: pathCol, weight: 6, opacity: .9, interactive: false }));
      selLayer.addLayer(L.polyline(chevrons(drawing, 35, 7), { color: '#fff', weight: 2.5, interactive: false }));
    }
    drawing.forEach((p, i) => selLayer.addLayer(L.marker(p, { interactive: false,
      icon: divIcon('<div class="vx' + (i === drawing.length - 1 ? ' end' : '') + '"></div>') })));
    camMarker();
    return;
  }
  const path = pathOf(c), idx = chosen(c);
  if (c.pending) c.cands.forEach((k, i) => {
    if (i === idx || k.pts.length < 2) return;
    const l = L.polyline(k.pts, { color: tok('--cand'), weight: 4, dashArray: '6 7', opacity: .9 });
    l.bindTooltip('Use ' + k.road + ' (' + compass(k.bearing) + ')', { sticky: true });
    l.on('click', () => { selVertex = null; save(c.id, { cand: i, path: undefined, approved: undefined }); });
    selLayer.addLayer(l);
  });
  if (path) {
    selLayer.addLayer(L.polyline(path, { color: pathCol, weight: 6, opacity: .9, interactive: false }));
    selLayer.addLayer(L.polyline(chevrons(path, 35, 7), { color: '#fff', weight: 2.5, interactive: false }));
    for (let i = 1; i < path.length; i++) {
      const m = [(path[i - 1][0] + path[i][0]) / 2, (path[i - 1][1] + path[i][1]) / 2];
      const mk = L.marker(m, { icon: divIcon('<div class="mid" title="Add a point here"></div>') });
      mk.on('click', () => { const p = path.slice(); p.splice(i, 0, [+m[0].toFixed(6), +m[1].toFixed(6)]); selVertex = i; save(c.id, { path: p, approved: undefined }); });
      selLayer.addLayer(mk);
    }
    path.forEach((p, i) => {
      const mk = L.marker(p, { draggable: true, keyboard: false,
        icon: divIcon('<div class="vx' + (i === selVertex ? ' sel' : '') + (i === path.length - 1 ? ' end' : '') + '"></div>') });
      mk.on('click', () => { selVertex = i; render(); });
      mk.on('dragend', ev => {
        const ll = ev.target.getLatLng(), pp = path.slice(); pp[i] = [+ll.lat.toFixed(6), +ll.lng.toFixed(6)];
        selVertex = i; save(c.id, { path: pp, approved: undefined });
      });
      selLayer.addLayer(mk);
    });
  }
  camMarker();
}
function fit() {
  const c = current; if (!c) return;
  const b = L.latLngBounds([[c.lat, c.lon]]);
  (pathOf(c) || []).forEach(p => b.extend(p));
  map.fitBounds(b.pad(0.3), { maxZoom: 18 });
}
function deleteVertex() {
  if (!current || selVertex === null) return;
  const p = pathOf(current).slice(); if (p.length <= 2) return;
  p.splice(selVertex, 1); selVertex = null;
  save(current.id, { path: p, approved: undefined });
}
map.on('click', ev => {
  if (!drawing) return;
  drawing.push([+ev.latlng.lat.toFixed(6), +ev.latlng.lng.toFixed(6)]);
  render();
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && selVertex !== null) { e.preventDefault(); deleteVertex(); }
});

// ---------- load: cameras waiting for review plus every published camera (Singapore and
// Malaysia), straight from the repo
const raw = f => fetch('https://raw.githubusercontent.com/' + REPO + '/main/' + f + '?t=' + Date.now(), { cache: 'no-store' })
  .then(r => r.ok ? r.json() : null).catch(() => null);
Promise.all([raw('review/pending.json'), raw('data/cameras.json'), raw('data/my_cameras.json')]).then(([P, D, M]) => {
  if (D) D = D.concat(M || []);
  if (!D) { bodyEl.innerHTML = '<div class="pad empty">Could not load the camera data. Check your connection and reload.</div>'; return; }
  const pending = ((P && P.cameras) || []).map(c => Object.assign(c, { pending: true }));
  const waiting = new Set(pending.map(c => c.id));
  CAMS = pending.concat(D.filter(c => !waiting.has(c.id))).map(c => Object.assign(c, { id: String(c.id), type: +c.type }));
  BY_ID = new Map(CAMS.map(c => [c.id, c]));
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    for (const k in s) if (BY_ID.has(k)) edits.set(k, s[k]);
  } catch (e) {}
  // Fixes that are now live drop out of the list on their own.
  for (const [id, e] of [...edits]) {
    const c = BY_ID.get(id);
    if (!c.pending && (!e.path || same(e.path, c.path))) edits.delete(id);
  }
  try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(edits))); } catch (e) {}
  const want = new URLSearchParams(location.search).get('id');
  mode = pending.length ? 'new' : 'fix';
  if (want && BY_ID.has(want)) select(want); else render();
});
</script>
</body>
</html>
